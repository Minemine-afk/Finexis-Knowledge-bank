<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}FinAssistant{% endblock %}</title>
<style>
:root{
  --ground:#F4F6F4; --surface:#fff; --surface-2:#EDF1EE; --line:#DCE3DF;
  --ink:#15201C; --ink-2:#44534D; --ink-3:#71837B;
  --accent:#0E5A4A; --accent-soft:#DDEBE4; --mark:#F3E9CE; --warn:#8F6410;
  --r:8px; --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root{ --ground:#0E1211; --surface:#161C1A; --surface-2:#1E2523; --line:#2B3532;
         --ink:#E9EFEB; --ink-2:#AEBDB7; --ink-3:#7F908A; --accent:#6FC2A8; --accent-soft:#1D332C;
         --mark:#4A3D18; --warn:#E0B864; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 var(--sans)}
a{color:var(--accent)}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
header .brand{font-weight:600;text-decoration:none;color:var(--ink)}
header .who{margin-left:auto;color:var(--ink-3);font-size:13px}
main{max-width:1180px;margin:0 auto;padding:20px 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
input,select,button{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
button{background:var(--accent);color:#fff;border-color:var(--accent);cursor:pointer}
label{display:block;font-size:12px;color:var(--ink-3);margin-bottom:3px}
.muted{color:var(--ink-3)} .small{font-size:13px}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);margin-right:4px}
.tag.private{background:var(--mark);color:var(--warn)}
mark{background:var(--mark);color:inherit;padding:0 1px}
table.grid{border-collapse:collapse;width:100%;font-size:13px}
table.grid th,table.grid td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
table.grid th{background:var(--surface-2)}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<header>
  <a class="brand" href="/">FinAssistant</a>
  {% if user %}<nav class="small"><a href="/">Chat</a> · <a href="/search">Search documents</a></nav>
  <span class="who">{{ user.display_name }} · <a href="/logout">switch user</a></span>{% endif %}
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
